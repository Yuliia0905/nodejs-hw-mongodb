tags:
  - Contacts
summary: Patch a contact
operationId: patchContact
description: 'Update a contact with the provided fields. Only the fields that are provided in the request will be updated.'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: The unique identifier for the contact to be updated.
    schema:
      type: string
      example: '672e559aefd1ec206c1b77a8'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '12345345345'
          email:
            description: "Contact's email"
            type: string
          isFavourite:
            description: "Contact's favourite status. Should be true or false"
            type: boolean
            example: true
          contactType:
            description: 'Type of contact. Should be work, home, or personal'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
